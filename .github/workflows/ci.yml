name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.0"
          python-version: "3.11"

      - name: Verify lockfile and install dependencies
        run: uv sync --locked

      - name: lint
        run: |
          uvx ruff@0.14.0 format --check .
          uvx ruff@0.14.0 check .

      - name: Check reference test discovery
        env:
          VAMPI_SECURE_URL: https://example.invalid
        run: uv run --locked python -m pytest --collect-only -q tests/reference/test_bola.py
